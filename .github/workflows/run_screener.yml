name: Quant Stock Screener Quarterly Run

on:
  # 1. Lịch chạy tự động hàng quý (00:00 UTC ngày đầu tiên các tháng 1, 4, 7, 10)
  schedule:
    - cron: '0 0 1 1,4,7,10 *'
  
  # 2. Cho phép bấm nút "Run workflow" thủ công trên giao diện GitHub khi muốn test
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Lấy code từ Repository về máy chủ ảo
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Bước 2: Khởi tạo môi trường Python 3.10
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Bước 3: Cài đặt các thư viện từ requirements.txt
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Bước 4: Chạy script Python lọc cổ phiếu
      - name: Run Quant Screener Script
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          python main.py

      # Bước 5: (Tùy chọn) Lưu file kết quả lọc (top_stocks.csv) lên GitHub
      - name: Commit & Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-update quarterly top stock list [skip ci]" || exit 0
          git push
